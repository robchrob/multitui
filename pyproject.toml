[project]
name = "oc_port"
version = "0.1.0"
description = "Python project with uv package manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
oc_port = "oc_port.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
